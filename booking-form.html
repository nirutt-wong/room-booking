<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบฟอร์มจองห้อง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Sarabun:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #1976d2;
    --navy-2: #4fa8e0;
    --gold: #6fc3e0;
    --gold-light: #d6eefa;
    --cream: #f4fafd;
    --paper: #ffffff;
    --ink: #22293a;
    --muted: #6b7280;
    --line: #dceaf3;
    --teal: #1e88a8;
    --red: #a9394a;
    --room1: #1976d2;
    --room2: #29a3c4;
    --room3: #5c9bd9;
    --room4: #4fb3bf;
    --room5: #3f6fc4;
    --room6: #57b8d6;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Sarabun', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .letterhead{
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff;
    padding: 28px clamp(16px, 4vw, 48px) 22px;
    position: relative;
    border-bottom: 4px solid var(--gold);
  }
  .letterhead::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-4px;
    height:4px;
    background: repeating-linear-gradient(90deg, var(--gold) 0 14px, transparent 14px 24px);
    opacity:.8;
  }
  .eyebrow{
    letter-spacing: .12em;
    font-size: 18px;
    color: var(--gold-light);
    text-transform: uppercase;
    margin: 0 0 6px;
    font-weight: 700;
  }
  h1{
    margin: 0;
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 700;
    letter-spacing: .01em;
  }
  .sub{
    margin: 6px 0 0;
    color: #d9e0ea;
    font-size: 14px;
  }

  main{
    max-width: 860px;
    margin: 0 auto;
    padding: 24px clamp(16px, 4vw, 48px) 60px;
  }

  .card{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(23,48,79,.04);
  }
  .card h2{
    margin: 0 0 16px;
    font-size: 17px;
    color: var(--navy);
    border-left: 4px solid var(--gold);
    padding-left: 10px;
  }

  .form-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 16px;
  }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field.full{ grid-column: 1 / -1; }
  .field label{ font-size: 12.5px; color: var(--muted); font-weight:600; }
  .field select, .field input{
    font-family: inherit;
    font-size: 14px;
    padding: 10px 11px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    width: 100%;
  }
  .field select:focus-visible, .field input:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  .btn{
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 20px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary{
    background: var(--navy);
    color: #fff;
  }
  .btn-primary:hover{ background: var(--navy-2); }
  .btn-ghost{
    background: transparent;
    color: var(--navy);
    border: 1px solid var(--navy);
  }
  .btn-ghost:hover{ background: rgba(23,48,79,.06); }
  .btn:active{ transform: translateY(1px); }
  .btn-block{ width: 100%; }

  .actions{
    display:flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .actions .btn{ flex: 1 1 160px; }

  .msg{
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 6px;
    margin-top: 14px;
    display: none;
  }
  .msg.show{ display:block; }
  .msg.ok{ background:#eaf3ef; color: var(--teal); border:1px solid #cfe6de; }
  .msg.err{ background:#fbebec; color: var(--red); border:1px solid #f0cfd2; }

  .recent{ list-style:none; margin:0; padding:0; }
  .recent li{
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  .recent li:last-child{ border-bottom:none; }
  .recent .r-name{ font-weight:700; color:var(--ink); }
  .recent .r-meta{ display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .recent-empty{ color:#9a9686; font-style:italic; font-size:13px; }

  .goto-card{
    background: linear-gradient(180deg, #fff 0%, #fbf9f2 100%);
    border: 1px solid var(--gold-light);
    text-align: center;
    padding: 26px 22px;
  }
  .goto-card p{
    margin: 0 0 14px;
    color: var(--muted);
    font-size: 13.5px;
  }

  footer{
    text-align:center;
    color: var(--muted);
    font-size: 12px;
    padding: 24px 0 6px;
  }

  @media (max-width: 640px){
    .form-grid{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="letterhead">
  <p class="eyebrow">ระบบจองห้องประชุมโรงเรียนสระแก้ว</p>
  <h1>แบบฟอร์มจองห้อง</h1>
  <p class="sub">กรอกรายละเอียดเพื่อจองห้องประชุม จากนั้นดูตารางรวมได้ที่หน้าแสดงผล</p>
</div>

<main>

  <div class="card">
    <h2>รายละเอียดการจอง</h2>
    <div class="form-grid">
      <div class="field">
        <label for="f-name">ชื่อผู้จอง</label>
        <input id="f-name" type="text" placeholder="เช่น อ.สมชาย ใจดี">
      </div>
      <div class="field">
        <label for="f-phone">เบอร์โทรผู้จอง</label>
        <input id="f-phone" type="tel" placeholder="เช่น 08X-XXX-XXXX">
      </div>
      <div class="field">
        <label for="f-room">ห้อง</label>
        <select id="f-room"></select>
      </div>
      <div class="field">
        <label for="f-date">วันที่จอง</label>
        <input id="f-date" type="date">
      </div>
      <div class="field">
        <label for="f-time-start">เวลาเริ่ม</label>
        <select id="f-time-start"></select>
      </div>
      <div class="field">
        <label for="f-time-end">เวลาสิ้นสุด</label>
        <select id="f-time-end"></select>
      </div>
      <div class="field">
        <label for="f-count">จำนวนผู้เข้าร่วม</label>
        <input id="f-count" type="number" min="1" placeholder="0">
      </div>
      <div class="field full">
        <label for="f-subject">เรื่องในการจอง</label>
        <input id="f-subject" type="text" placeholder="เช่น ประชุมประจำเดือน">
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="add-btn">+ เพิ่มการจอง</button>
      <button class="btn btn-ghost" id="reset-btn">ล้างข้อมูลตัวอย่าง</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h2>รายการที่จองล่าสุด</h2>
    <ul class="recent" id="recent-list"></ul>
  </div>

  <div class="card goto-card">
    <p>ต้องการดูภาพรวมการจองทุกห้อง แยกตามวันที่และห้องประชุม</p>
    <a class="btn btn-primary btn-block" href="booking-schedule.html">📅 ดูตารางการจองห้องทั้งหมด</a>
  </div>

  <footer></footer>
</main>

<script>
  // ==== ตั้งค่าตรงนี้: วาง URL ของ Google Apps Script Web App ที่ deploy แล้ว ====
  const API_URL = "https://script.google.com/macros/s/AKfycby87wunNWBj-RrYFdz_lHQurfbIh3NWEaZ8hx2zqbD1Jo7hwVxZnBCCUU3UzkusXbjA/exec";
  // =============================================================================

  const ROOMS = [
    { id: "r1", name: "ห้องประชุมคุรุธรรมจารุ", color: "var(--room1)" },
    { id: "r2", name: "หอประชุมบุญเล็ก",         color: "var(--room2)" },
    { id: "r3", name: "ห้องสื่อมัลติมีเดีย",       color: "var(--room3)" },
    { id: "r4", name: "ห้องประชุม ICT",           color: "var(--room4)" },
    { id: "r5", name: "โดมเฉลิมราช ร.10",         color: "var(--room5)" },
    { id: "r6", name: "ห้องสมุดชั้นบน",           color: "var(--room6)" },
  ];

  const THAI_MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

  const SAMPLE_BOOKINGS = [
    { id: 1, room: "r1", date: "2026-08-20", timeStart: "09:00", timeEnd: "11:00", name: "ผอ.สมหญิง วงศ์ประเสริฐ", phone: "081-234-5671", count: 45, subject: "ประชุมคณะกรรมการสถานศึกษา" },
    { id: 2, room: "r2", date: "2026-08-20", timeStart: "08:30", timeEnd: "10:00", name: "ฝ่ายกิจการนักเรียน", phone: "081-234-5672", count: 220, subject: "ปฐมนิเทศนักเรียนใหม่" },
    { id: 3, room: "r4", date: "2026-08-20", timeStart: "13:00", timeEnd: "16:00", name: "ครูวิชัย ไอทีเวช", phone: "081-234-5673", count: 18, subject: "อบรมการใช้ระบบ e-Office" },
    { id: 4, room: "r3", date: "2026-08-21", timeStart: "09:00", timeEnd: "12:00", name: "กลุ่มสาระการเรียนรู้ศิลปะ", phone: "081-234-5674", count: 12, subject: "ตัดต่อวิดีโอผลงานนักเรียน" },
    { id: 5, room: "r1", date: "2026-08-22", timeStart: "13:00", timeEnd: "15:00", name: "ครูสมศักดิ์ แสงทอง", phone: "081-234-5675", count: 30, subject: "ประชุมผู้ปกครองระดับชั้น ม.3" },
    { id: 6, room: "r5", date: "2026-08-22", timeStart: "08:00", timeEnd: "12:00", name: "ฝ่ายกิจกรรม", phone: "081-234-5676", count: 500, subject: "พิธีถวายพระพรวันเฉลิมพระชนมพรรษา" },
    { id: 7, room: "r2", date: "2026-08-24", timeStart: "14:00", timeEnd: "17:00", name: "ชมรมดนตรีไทย", phone: "081-234-5677", count: 60, subject: "ซ้อมการแสดงเปิดภาคเรียน" },
    { id: 8, room: "r4", date: "2026-08-25", timeStart: "09:00", timeEnd: "10:30", name: "งานทะเบียนและวัดผล", phone: "081-234-5678", count: 8, subject: "ประชุมวางแผนระบบสารสนเทศ" },
    { id: 9, room: "r3", date: "2026-08-25", timeStart: "13:00", timeEnd: "17:00", name: "ครูปิยะดา ภาพยนตร์", phone: "081-234-5679", count: 15, subject: "อัดคลิปสื่อการสอนออนไลน์" },
    { id: 10, room: "r5", date: "2026-08-27", timeStart: "08:00", timeEnd: "18:00", name: "ฝ่ายอาคารสถานที่", phone: "081-234-5680", count: 350, subject: "พิธีไหว้ครูประจำปีการศึกษา" },
  ];

  // เรียก API ของ Apps Script ทุกคนอ่าน/เขียนข้อมูลชุดเดียวกันบน Google Sheet
  // ใช้ Content-Type: text/plain เพื่อเลี่ยง CORS preflight ที่ Apps Script ไม่รองรับ
  async function apiCall(payload){
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  async function apiList(){
    const res = await fetch(`${API_URL}?action=list`);
    return res.json();
  }

  let state = { bookings: [] };

  async function loadBookings(){
    try{
      const data = await apiList();
      if(data.ok) state.bookings = data.bookings;
      else showMsg("โหลดข้อมูลไม่สำเร็จ: " + (data.error || ""), "err");
    }catch(e){
      showMsg("เชื่อมต่อระบบไม่สำเร็จ กรุณาตรวจสอบ API_URL หรือการเชื่อมต่ออินเทอร์เน็ต", "err");
    }
  }

  const roomSelect = document.getElementById("f-room");
  ROOMS.forEach(r => {
    const opt = document.createElement("option");
    opt.value = r.id;
    opt.textContent = r.name;
    roomSelect.appendChild(opt);
  });

  // สร้างตัวเลือกเวลาทุก 30 นาที ตั้งแต่ 08:00 ถึง 18:00
  function buildTimeSlots(){
    const slots = [];
    for(let mins = 8 * 60; mins <= 18 * 60; mins += 30){
      const h = String(Math.floor(mins / 60)).padStart(2, "0");
      const m = String(mins % 60).padStart(2, "0");
      slots.push(`${h}:${m}`);
    }
    return slots;
  }
  const TIME_SLOTS = buildTimeSlots();
  const timeStartSelect = document.getElementById("f-time-start");
  const timeEndSelect = document.getElementById("f-time-end");
  [timeStartSelect, timeEndSelect].forEach(sel => {
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "-- เลือกเวลา --";
    sel.appendChild(placeholder);
    TIME_SLOTS.forEach(t => {
      const opt = document.createElement("option");
      opt.value = t;
      opt.textContent = `${t} น.`;
      sel.appendChild(opt);
    });
  });

  function roomName(id){
    const r = ROOMS.find(r => r.id === id);
    return r ? r.name : id;
  }

  function formatDate(iso){
    const d = new Date(iso + "T00:00:00");
    return `${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}`;
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function showMsg(text, type){
    const el = document.getElementById("msg");
    el.textContent = text;
    el.className = `msg show ${type}`;
    setTimeout(() => { el.classList.remove("show"); }, 3500);
  }

  function renderRecent(){
    const list = document.getElementById("recent-list");
    const recent = [...state.bookings].sort((a,b) => b.id - a.id).slice(0, 2);
    if(recent.length === 0){
      list.innerHTML = `<li class="recent-empty">ยังไม่มีรายการจอง</li>`;
      return;
    }
    list.innerHTML = recent.map(b => `
      <li>
        <span class="r-name">${escapeHtml(b.name)}${b.phone ? ` · ${escapeHtml(b.phone)}` : ""}</span>
        <span class="r-meta">${roomName(b.room)} · ${formatDate(b.date)}${b.timeStart ? ` (${b.timeStart}-${b.timeEnd} น.)` : ""} · ผู้เข้าร่วม ${b.count} คน · ${escapeHtml(b.subject)}</span>
      </li>
    `).join("");
  }

  const addBtn = document.getElementById("add-btn");

  addBtn.addEventListener("click", async () => {
    const name = document.getElementById("f-name").value.trim();
    const phone = document.getElementById("f-phone").value.trim();
    const room = document.getElementById("f-room").value;
    const date = document.getElementById("f-date").value;
    const timeStart = document.getElementById("f-time-start").value;
    const timeEnd = document.getElementById("f-time-end").value;
    const count = document.getElementById("f-count").value;
    const subject = document.getElementById("f-subject").value.trim();

    if(!name || !phone || !date || !timeStart || !timeEnd || !count || !subject){
      showMsg("กรุณากรอกข้อมูลให้ครบทุกช่องก่อนเพิ่มการจอง", "err");
      return;
    }

    if(timeStart < "08:00" || timeEnd > "18:00"){
      showMsg("สามารถจองห้องได้เฉพาะเวลา 08:00 - 18:00 น. เท่านั้น", "err");
      return;
    }

    if(timeStart >= timeEnd){
      showMsg("เวลาเริ่มต้องน้อยกว่าเวลาสิ้นสุด กรุณาตรวจสอบอีกครั้ง", "err");
      return;
    }

    const isOverlapping = state.bookings.some(b =>
      b.room === room && b.date === date && timeStart < b.timeEnd && b.timeStart < timeEnd
    );
    if(isOverlapping){
      showMsg(`ห้อง "${roomName(room)}" มีการจองช่วงเวลาที่ทับกันในวันที่ ${formatDate(date)} กรุณาเลือกเวลาอื่น`, "err");
      return;
    }

    addBtn.disabled = true;
    addBtn.textContent = "กำลังบันทึก...";
    try{
      const result = await apiCall({
        action: "add",
        booking: { room, date, timeStart, timeEnd, name, phone, count: Number(count), subject }
      });
      if(!result.ok){
        showMsg(result.error || "บันทึกไม่สำเร็จ กรุณาลองใหม่", "err");
        return;
      }
      state.bookings = result.bookings;
      renderRecent();
      showMsg("เพิ่มการจองเรียบร้อยแล้ว ✓ ทุกคนจะเห็นรายการนี้ในตารางรวมทันที", "ok");

      document.getElementById("f-name").value = "";
      document.getElementById("f-phone").value = "";
      document.getElementById("f-date").value = "";
      document.getElementById("f-time-start").value = "";
      document.getElementById("f-time-end").value = "";
      document.getElementById("f-count").value = "";
      document.getElementById("f-subject").value = "";
    }catch(e){
      showMsg("เชื่อมต่อระบบไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่", "err");
    }finally{
      addBtn.disabled = false;
      addBtn.textContent = "+ เพิ่มการจอง";
    }
  });

  document.getElementById("reset-btn").addEventListener("click", async () => {
    if(!confirm("ล้างข้อมูลจริงทั้งหมดในระบบ และแทนที่ด้วยข้อมูลตัวอย่างหรือไม่? การกระทำนี้มีผลต่อทุกคนที่ใช้ระบบ")) return;
    try{
      const result = await apiCall({ action: "reset", bookings: SAMPLE_BOOKINGS });
      if(!result.ok){
        showMsg(result.error || "ล้างข้อมูลไม่สำเร็จ", "err");
        return;
      }
      state.bookings = result.bookings;
      renderRecent();
      showMsg("ล้างและคืนค่าข้อมูลตัวอย่างเรียบร้อยแล้ว", "ok");
    }catch(e){
      showMsg("เชื่อมต่อระบบไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่", "err");
    }
  });

  (async () => {
    if(API_URL.includes("PASTE_YOUR_WEB_APP_URL_HERE")){
      showMsg("ยังไม่ได้ตั้งค่า API_URL กรุณาวาง URL ของ Apps Script Web App ในโค้ด", "err");
      return;
    }
    await loadBookings();
    renderRecent();
  })();
</script>

</body>
</html>
