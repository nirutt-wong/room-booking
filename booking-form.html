<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แบบฟอร์มจองห้อง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Sarabun:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #16a34a;
    --navy-2: #6ee7a0;
    --gold: #34d399;
    --gold-light: #d7f5e3;
    --cream: #f6fdf9;
    --paper: #ffffff;
    --ink: #1c3326;
    --muted: #7a9086;
    --line: #d3f0dd;
    --teal: #0f8a4e;
    --red: #c0392b;
    --room1: #16a34a;
    --room2: #22b573;
    --room3: #4ade80;
    --room4: #059669;
    --room5: #15803d;
    --room6: #6ee7a0;
    --room7: #10b981;
    --room8: #65a30d;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: linear-gradient(180deg, #f6fdf9 0%, #eafaf0 100%);
    color: var(--ink);
    font-family: 'Sarabun', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .letterhead{
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff;
    padding: 28px clamp(16px, 4vw, 48px) 22px;
    position: relative;
    border-bottom: 4px solid var(--gold);
  }
  .letterhead::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-4px;
    height:4px;
    background: repeating-linear-gradient(90deg, var(--gold) 0 14px, transparent 14px 24px);
    opacity:.8;
  }
  .eyebrow{
    letter-spacing: .12em;
    font-size: 18px;
    color: var(--gold-light);
    text-transform: uppercase;
    margin: 0 0 6px;
    font-weight: 700;
  }
  h1{
    margin: 0;
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 700;
    letter-spacing: .01em;
  }
  .sub{
    margin: 6px 0 0;
    color: #d9e0ea;
    font-size: 14px;
  }

  main{
    max-width: 860px;
    margin: 0 auto;
    padding: 24px clamp(16px, 4vw, 48px) 60px;
  }

  .card{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 1px 2px rgba(23,48,79,.04);
  }
  .card h2{
    margin: 0 0 16px;
    font-size: 17px;
    color: var(--navy);
    border-left: 4px solid var(--gold);
    padding-left: 10px;
  }

  .form-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 16px;
  }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field.full{ grid-column: 1 / -1; }
  .field label{ font-size: 12.5px; color: var(--muted); font-weight:600; }
  .field select, .field input{
    font-family: inherit;
    font-size: 14px;
    padding: 10px 11px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    width: 100%;
  }
  .field select:focus-visible, .field input:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }

  .btn{
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 20px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary{
    background: var(--navy);
    color: #fff;
  }
  .btn-primary:hover{ background: var(--navy-2); }
  .btn-ghost{
    background: transparent;
    color: var(--navy);
    border: 1px solid var(--navy);
  }
  .btn-ghost:hover{ background: rgba(23,48,79,.06); }
  .btn:active{ transform: translateY(1px); }
  .btn-block{ width: 100%; }

  .actions{
    display:flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .actions .btn{ flex: 1 1 160px; }

  .msg{
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 6px;
    margin-top: 14px;
    display: none;
  }
  .msg.show{ display:block; }
  .msg.ok{ background:#e6f8ec; color: var(--teal); border:1px solid #b7ecc7; }
  .msg.err{ background:#fdecea; color: var(--red); border:1px solid #f5c6c2; }

  .recent{ list-style:none; margin:0; padding:0; }
  .recent li{
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  .recent li:last-child{ border-bottom:none; }
  .recent .r-name{ font-weight:700; color:var(--ink); }
  .recent .r-meta{ display:block; color:var(--muted); font-size:12px; margin-top:2px; }
  .recent-empty{ color:#9db7a8; font-style:italic; font-size:13px; }

  .goto-card{
    background: linear-gradient(180deg, #fff 0%, #ecfbf1 100%);
    border: 1px solid var(--gold-light);
    text-align: center;
    padding: 26px 22px;
  }
  .goto-card p{
    margin: 0 0 14px;
    color: var(--muted);
    font-size: 13.5px;
  }

  footer{
    text-align:center;
    color: var(--muted);
    font-size: 12px;
    padding: 24px 0 6px;
  }

  @media (max-width: 640px){
    .form-grid{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="letterhead">
  <p class="eyebrow">ระบบจองห้องประชุมโรงเรียนสระแก้ว</p>
  <h1>แบบฟอร์มจองห้อง</h1>
  <p class="sub">กรอกรายละเอียดเพื่อจองห้องประชุม จากนั้นดูตารางรวมได้ที่หน้าแสดงผล</p>
</div>

<main>

  <div class="card">
    <h2>รายละเอียดการจอง</h2>
    <div class="form-grid">
      <div class="field">
        <label for="f-name">ชื่อผู้จอง</label>
        <input id="f-name" type="text" placeholder="เช่น อ.สมชาย ใจดี">
      </div>
      <div class="field">
        <label for="f-phone">เบอร์โทรผู้จอง</label>
        <input id="f-phone" type="tel" placeholder="เช่น 08X-XXX-XXXX">
      </div>
      <div class="field">
        <label for="f-room">ห้อง</label>
        <select id="f-room"></select>
      </div>
      <div class="field">
        <label for="f-date">วันที่จอง</label>
        <input id="f-date" type="date">
      </div>
      <div class="field">
        <label for="f-time-start">เวลาเริ่ม</label>
        <select id="f-time-start"></select>
      </div>
      <div class="field">
        <label for="f-time-end">เวลาสิ้นสุด</label>
        <select id="f-time-end"></select>
      </div>
      <div class="field">
        <label for="f-count">จำนวนผู้เข้าร่วม</label>
        <input id="f-count" type="number" min="1" placeholder="0">
      </div>
      <div class="field full">
        <label for="f-subject">เรื่องในการจอง</label>
        <input id="f-subject" type="text" placeholder="เช่น ประชุมประจำเดือน">
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="add-btn">+ เพิ่มการจอง</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h2>รายการที่จองล่าสุด</h2>
    <ul class="recent" id="recent-list"></ul>
  </div>

  <div class="card goto-card">
    <p>ต้องการดูภาพรวมการจองทุกห้อง แยกตามวันที่และห้องประชุม</p>
    <a class="btn btn-primary btn-block" href="booking-schedule.html">📅 ดูตารางการจองห้องทั้งหมด</a>
  </div>

  <footer></footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  // ==== ตั้งค่า Supabase ====
  const SUPABASE_URL = "https://vfcbjrqcstukklucpzzf.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmY2JqcnFjc3R1a2tsdWNwenpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwNDIwMTUsImV4cCI6MjEwNTYxODAxNX0.sstUEBkWOyN89U-oktGpjlXzKb6Nh-4Fju_RHH6Ca88";
  // ===========================

  // ---------- 1) เตรียมข้อมูลพื้นฐานและวาด dropdown ทันที ----------
  // ทำส่วนนี้ก่อนแตะ Supabase เลย เพื่อให้ฟอร์มเลือกห้อง/เวลาใช้งานได้
  // แม้ Supabase library จะโหลดไม่สำเร็จ (เน็ตช้า, ถูกบล็อก ฯลฯ)

  let ROOMS = [
    { id: "r1", name: "ห้องประชุมคุรุธรรมจารุ", color: "var(--room1)" },
    { id: "r2", name: "หอประชุมบุญเล็ก",         color: "var(--room2)" },
    { id: "r3", name: "ห้องสื่อมัลติมีเดีย",       color: "var(--room3)" },
    { id: "r4", name: "ห้องประชุม ICT",           color: "var(--room4)" },
    { id: "r5", name: "โดมเฉลิมราช ร.10",         color: "var(--room5)" },
    { id: "r6", name: "ห้องสมุดชั้นบน",           color: "var(--room6)" },
    { id: "r7", name: "ห้องทวีผล",                color: "var(--room7)" },
    { id: "r8", name: "ห้องบัวคำศรี",              color: "var(--room8)" },
  ];

  const THAI_MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

  const roomSelect = document.getElementById("f-room");
  function renderRoomOptions(){
    roomSelect.innerHTML = "";
    ROOMS.forEach(r => {
      const opt = document.createElement("option");
      opt.value = r.id;
      opt.textContent = r.name;
      roomSelect.appendChild(opt);
    });
  }
  renderRoomOptions();

  // สร้างตัวเลือกเวลาทุก 30 นาที ตั้งแต่ 08:00 ถึง 18:00
  function buildTimeSlots(){
    const slots = [];
    for(let mins = 8 * 60; mins <= 18 * 60; mins += 30){
      const h = String(Math.floor(mins / 60)).padStart(2, "0");
      const m = String(mins % 60).padStart(2, "0");
      slots.push(`${h}:${m}`);
    }
    return slots;
  }
  const TIME_SLOTS = buildTimeSlots();
  const timeStartSelect = document.getElementById("f-time-start");
  const timeEndSelect = document.getElementById("f-time-end");
  [timeStartSelect, timeEndSelect].forEach(sel => {
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "-- เลือกเวลา --";
    sel.appendChild(placeholder);
    TIME_SLOTS.forEach(t => {
      const opt = document.createElement("option");
      opt.value = t;
      opt.textContent = `${t} น.`;
      sel.appendChild(opt);
    });
  });

  function roomName(id){
    const r = ROOMS.find(r => r.id === id);
    return r ? r.name : id;
  }

  function formatDate(iso){
    const d = new Date(iso + "T00:00:00");
    return `${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}`;
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function showMsg(text, type){
    const el = document.getElementById("msg");
    el.textContent = text;
    el.className = `msg show ${type}`;
    setTimeout(() => { el.classList.remove("show"); }, 3500);
  }

  // ---------- 2) เชื่อมต่อ Supabase (แยกจากส่วนบน กันไม่ให้ error ไปหยุดการวาดฟอร์ม) ----------
  let sb = null;
  try{
    if(window.supabase && typeof window.supabase.createClient === "function"){
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    } else {
      throw new Error("Supabase library ยังไม่โหลด");
    }
  }catch(e){
    console.error(e);
    showMsg("เชื่อมต่อฐานข้อมูลไม่สำเร็จ (โหลดไลบรารี Supabase ไม่ได้) กรุณารีเฟรชหน้าเว็บ", "err");
  }

  // แปลงแถวจากตาราง bookings (snake_case) ให้เป็นรูปแบบที่โค้ดฝั่งหน้าเว็บใช้ (camelCase)
  function fromDbBooking(row){
    return {
      id: row.id,
      room: row.room_id,
      date: row.booking_date,
      timeStart: row.time_start ? row.time_start.slice(0,5) : row.time_start,
      timeEnd: row.time_end ? row.time_end.slice(0,5) : row.time_end,
      name: row.name,
      phone: row.phone,
      count: row.attendee_count,
      subject: row.subject,
      createdAt: row.created_at
    };
  }

  let state = { bookings: [] };

  async function loadRooms(){
    if(!sb) return;
    const { data, error } = await sb.from("rooms").select("*");
    if(error){
      showMsg("โหลดรายชื่อห้องไม่สำเร็จ: " + error.message, "err");
      return;
    }
    if(data && data.length){
      ROOMS = data.map(r => ({ id: r.id, name: r.name, color: r.color }));
    }
  }

  async function loadBookings(){
    if(!sb) return;
    const { data, error } = await sb
      .from("bookings")
      .select("*")
      .order("created_at", { ascending: true });
    if(error){
      showMsg("โหลดข้อมูลไม่สำเร็จ: " + error.message, "err");
      return;
    }
    state.bookings = data.map(fromDbBooking);
  }

  function renderRecent(){
    const list = document.getElementById("recent-list");
    // ใช้ตำแหน่งท้ายอาร์เรย์แทนการเรียงด้วย id (id อาจเป็น string ทำให้ b.id - a.id ได้ NaN
    // และ sort() ไม่เรียงลำดับให้ ผลคือได้รายการเก่าสุดแทนที่จะเป็นรายการล่าสุด)
    // สมมติว่า backend ส่งรายการเรียงจากเก่าสุด -> ใหม่สุดเสมอ (แถวถูกเพิ่มต่อท้ายชีต)
    const recent = [...state.bookings].slice(-2).reverse();
    if(recent.length === 0){
      list.innerHTML = `<li class="recent-empty">ยังไม่มีรายการจอง</li>`;
      return;
    }
    list.innerHTML = recent.map(b => `
      <li>
        <span class="r-name">${escapeHtml(b.name)}${b.phone ? ` · ${escapeHtml(b.phone)}` : ""}</span>
        <span class="r-meta">${roomName(b.room)} · ${formatDate(b.date)}${b.timeStart ? ` (${b.timeStart}-${b.timeEnd} น.)` : ""} · ผู้เข้าร่วม ${b.count} คน · ${escapeHtml(b.subject)}</span>
      </li>
    `).join("");
  }

  const addBtn = document.getElementById("add-btn");

  addBtn.addEventListener("click", async () => {
    if(!sb){
      showMsg("เชื่อมต่อฐานข้อมูลไม่สำเร็จ กรุณารีเฟรชหน้าเว็บแล้วลองใหม่", "err");
      return;
    }

    const name = document.getElementById("f-name").value.trim();
    const phone = document.getElementById("f-phone").value.trim();
    const room = document.getElementById("f-room").value;
    const date = document.getElementById("f-date").value;
    const timeStart = document.getElementById("f-time-start").value;
    const timeEnd = document.getElementById("f-time-end").value;
    const count = document.getElementById("f-count").value;
    const subject = document.getElementById("f-subject").value.trim();

    if(!name || !phone || !date || !timeStart || !timeEnd || !count || !subject){
      showMsg("กรุณากรอกข้อมูลให้ครบทุกช่องก่อนเพิ่มการจอง", "err");
      return;
    }

    if(timeStart < "08:00" || timeEnd > "18:00"){
      showMsg("สามารถจองห้องได้เฉพาะเวลา 08:00 - 18:00 น. เท่านั้น", "err");
      return;
    }

    if(timeStart >= timeEnd){
      showMsg("เวลาเริ่มต้องน้อยกว่าเวลาสิ้นสุด กรุณาตรวจสอบอีกครั้ง", "err");
      return;
    }

    const isOverlapping = state.bookings.some(b =>
      b.room === room && b.date === date && timeStart < b.timeEnd && b.timeStart < timeEnd
    );
    if(isOverlapping){
      showMsg(`ห้อง "${roomName(room)}" มีการจองช่วงเวลาที่ทับกันในวันที่ ${formatDate(date)} กรุณาเลือกเวลาอื่น`, "err");
      return;
    }

    addBtn.disabled = true;
    addBtn.textContent = "กำลังบันทึก...";
    try{
      const { data, error } = await sb
        .from("bookings")
        .insert({
          room_id: room,
          booking_date: date,
          time_start: timeStart,
          time_end: timeEnd,
          name,
          phone,
          attendee_count: Number(count),
          subject
        })
        .select();

      if(error){
        // รหัส 23P01 = ชนกับ constraint กันจองทับซ้อนที่ตั้งไว้ในฐานข้อมูล
        if(error.code === "23P01"){
          showMsg(`ห้อง "${roomName(room)}" มีการจองช่วงเวลาที่ทับกันในวันที่ ${formatDate(date)} กรุณาเลือกเวลาอื่น`, "err");
        } else {
          showMsg(error.message || "บันทึกไม่สำเร็จ กรุณาลองใหม่", "err");
        }
        return;
      }

      state.bookings.push(fromDbBooking(data[0]));
      renderRecent();
      showMsg("เพิ่มการจองเรียบร้อยแล้ว ✓ ทุกคนจะเห็นรายการนี้ในตารางรวมทันที", "ok");

      document.getElementById("f-name").value = "";
      document.getElementById("f-phone").value = "";
      document.getElementById("f-date").value = "";
      document.getElementById("f-time-start").value = "";
      document.getElementById("f-time-end").value = "";
      document.getElementById("f-count").value = "";
      document.getElementById("f-subject").value = "";
    }catch(e){
      showMsg("เชื่อมต่อระบบไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่", "err");
    }finally{
      addBtn.disabled = false;
      addBtn.textContent = "+ เพิ่มการจอง";
    }
  });

  (async () => {
    if(!sb) return;
    await loadRooms();
    renderRoomOptions();
    await loadBookings();
    renderRecent();
  })();
</script>

</body>
</html>
