<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตารางการจองห้อง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Sarabun:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #1976d2;
    --navy-2: #4fa8e0;
    --gold: #6fc3e0;
    --gold-light: #d6eefa;
    --cream: #f4fafd;
    --paper: #ffffff;
    --ink: #22293a;
    --muted: #6b7280;
    --line: #dceaf3;
    --teal: #1e88a8;
    --red: #a9394a;
    --room1: #1976d2;
    --room2: #29a3c4;
    --room3: #5c9bd9;
    --room4: #4fb3bf;
    --room5: #3f6fc4;
    --room6: #57b8d6;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Sarabun', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .letterhead{
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff;
    padding: 28px clamp(16px, 4vw, 48px) 22px;
    position: relative;
    border-bottom: 4px solid var(--gold);
  }
  .letterhead::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-4px;
    height:4px;
    background: repeating-linear-gradient(90deg, var(--gold) 0 14px, transparent 14px 24px);
    opacity:.8;
  }
  .eyebrow{
    letter-spacing: .12em;
    font-size: 18px;
    color: var(--gold-light);
    text-transform: uppercase;
    margin: 0 0 6px;
    font-weight: 700;
  }
  h1{
    margin: 0;
    font-size: clamp(22px, 3vw, 30px);
    font-weight: 700;
    letter-spacing: .01em;
  }
  .sub{
    margin: 6px 0 0;
    color: #d9e0ea;
    font-size: 14px;
  }

  main{
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px clamp(16px, 4vw, 48px) 60px;
  }

  .toolbar{
    display:flex;
    flex-wrap: wrap;
    gap: 10px 14px;
    align-items: center;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 18px;
  }
  .toolbar .spacer{ flex: 1; }

  .btn{
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    text-decoration: none;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .btn-primary{
    background: var(--navy);
    color: #fff;
  }
  .btn-primary:hover{ background: var(--navy-2); }
  .btn-ghost{
    background: transparent;
    color: var(--navy);
    border: 1px solid var(--navy);
  }
  .btn-ghost:hover{ background: rgba(23,48,79,.06); }
  .btn:active{ transform: translateY(1px); }
  .btn:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .legend{
    display:flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    margin: 0 0 14px;
    font-size: 13px;
    color: var(--muted);
  }
  .legend span{ display:flex; align-items:center; gap:6px; }
  .dot{ width:10px; height:10px; border-radius:50%; display:inline-block; }

  .table-wrap{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: auto;
    box-shadow: 0 1px 2px rgba(23,48,79,.04);
  }

  table{
    border-collapse: collapse;
    width: 100%;
    min-width: 1120px;
  }
  thead th{
    position: sticky;
    top: 0;
    background: var(--navy);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    padding: 12px 14px;
    border-bottom: 3px solid var(--gold);
    z-index: 2;
  }
  thead th.date-col{
    min-width: 110px;
    background: var(--navy-2);
  }
  thead th .room-bar{
    display:block;
    width: 28px;
    height: 3px;
    border-radius: 2px;
    margin-bottom: 6px;
  }

  tbody td{
    vertical-align: top;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    border-right: 1px solid var(--line);
    font-size: 13.5px;
  }
  tbody td:last-child{ border-right: none; }
  tbody tr:nth-child(even){ background: #fbfaf5; }
  tbody tr:hover{ background: #f1efe4; }

  .date-cell{
    font-weight: 700;
    color: var(--navy);
    white-space: nowrap;
    background: #f4f1e6 !important;
  }
  .date-cell .weekday{
    display:block;
    font-weight: 500;
    font-size: 11.5px;
    color: var(--muted);
  }

  .empty-cell{
    color: #c3c0b3;
    font-style: italic;
    font-size: 13px;
  }

  .booking{
    border-left: 3px solid var(--room1);
    padding: 6px 0 6px 10px;
    margin-bottom: 8px;
    position: relative;
  }
  .booking:last-child{ margin-bottom: 0; }
  .booking .name{
    font-weight: 700;
    color: var(--ink);
    display:block;
  }
  .booking .meta{
    font-size: 12px;
    color: var(--muted);
    display:block;
    margin-top: 1px;
  }
  .booking .subject{
    font-size: 12.5px;
    color: #3a4257;
    margin-top: 3px;
    display:block;
  }
  .del{
    position:absolute;
    top: 4px; right: 0;
    background:none;
    border:none;
    color: var(--red);
    font-size: 11px;
    cursor:pointer;
    opacity: 0;
    transition: opacity .12s ease;
  }
  .booking:hover .del{ opacity: 1; }

  footer{
    text-align:center;
    color: var(--muted);
    font-size: 12px;
    padding: 24px 0 6px;
  }

  @media (max-width: 720px){
    .toolbar{ flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<div class="letterhead">
  <p class="eyebrow">ระบบจองห้องประชุมโรงเรียนสระแก้ว</p>
  <h1>ตารางการจองห้อง</h1>
  <p class="sub">แสดงรายการจองแยกตามห้อง พร้อมวันที่ ผู้จอง จำนวนผู้เข้าร่วม และเรื่องการจอง</p>
</div>

<main>

  <div class="toolbar">
    <a class="btn btn-primary" href="booking-form.html">+ เพิ่มการจองห้องใหม่</a>
    <div class="spacer"></div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr id="head-row"></tr>
      </thead>
      <tbody id="body-rows"></tbody>
    </table>
  </div>

  <footer></footer>
</main>

<script>
  // ==== ตั้งค่าตรงนี้: วาง URL ของ Google Apps Script Web App ที่ deploy แล้ว (ต้องเป็น URL เดียวกับในหน้าแบบฟอร์ม) ====
  const API_URL = "https://script.google.com/macros/s/AKfycby87wunNWBj-RrYFdz_lHQurfbIh3NWEaZ8hx2zqbD1Jo7hwVxZnBCCUU3UzkusXbjA/exec";
  // ====================================================================================================

  const ROOMS = [
    { id: "r1", name: "ห้องประชุมคุรุธรรมจารุ", color: "var(--room1)" },
    { id: "r2", name: "หอประชุมบุญเล็ก",         color: "var(--room2)" },
    { id: "r3", name: "ห้องสื่อมัลติมีเดีย",       color: "var(--room3)" },
    { id: "r4", name: "ห้องประชุม ICT",           color: "var(--room4)" },
    { id: "r5", name: "โดมเฉลิมราช ร.10",         color: "var(--room5)" },
    { id: "r6", name: "ห้องสมุดชั้นบน",           color: "var(--room6)" },
  ];

  const WEEKDAYS = ["อา.", "จ.", "อ.", "พ.", "พฤ.", "ศ.", "ส."];
  const THAI_MONTHS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

  const SAMPLE_BOOKINGS = [
    { id: 1, room: "r1", date: "2026-08-20", timeStart: "09:00", timeEnd: "11:00", name: "ผอ.สมหญิง วงศ์ประเสริฐ", phone: "081-234-5671", count: 45, subject: "ประชุมคณะกรรมการสถานศึกษา" },
    { id: 2, room: "r2", date: "2026-08-20", timeStart: "08:30", timeEnd: "10:00", name: "ฝ่ายกิจการนักเรียน", phone: "081-234-5672", count: 220, subject: "ปฐมนิเทศนักเรียนใหม่" },
    { id: 3, room: "r4", date: "2026-08-20", timeStart: "13:00", timeEnd: "16:00", name: "ครูวิชัย ไอทีเวช", phone: "081-234-5673", count: 18, subject: "อบรมการใช้ระบบ e-Office" },
    { id: 4, room: "r3", date: "2026-08-21", timeStart: "09:00", timeEnd: "12:00", name: "กลุ่มสาระการเรียนรู้ศิลปะ", phone: "081-234-5674", count: 12, subject: "ตัดต่อวิดีโอผลงานนักเรียน" },
    { id: 5, room: "r1", date: "2026-08-22", timeStart: "13:00", timeEnd: "15:00", name: "ครูสมศักดิ์ แสงทอง", phone: "081-234-5675", count: 30, subject: "ประชุมผู้ปกครองระดับชั้น ม.3" },
    { id: 6, room: "r5", date: "2026-08-22", timeStart: "08:00", timeEnd: "12:00", name: "ฝ่ายกิจกรรม", phone: "081-234-5676", count: 500, subject: "พิธีถวายพระพรวันเฉลิมพระชนมพรรษา" },
    { id: 7, room: "r2", date: "2026-08-24", timeStart: "14:00", timeEnd: "17:00", name: "ชมรมดนตรีไทย", phone: "081-234-5677", count: 60, subject: "ซ้อมการแสดงเปิดภาคเรียน" },
    { id: 8, room: "r4", date: "2026-08-25", timeStart: "09:00", timeEnd: "10:30", name: "งานทะเบียนและวัดผล", phone: "081-234-5678", count: 8, subject: "ประชุมวางแผนระบบสารสนเทศ" },
    { id: 9, room: "r3", date: "2026-08-25", timeStart: "13:00", timeEnd: "17:00", name: "ครูปิยะดา ภาพยนตร์", phone: "081-234-5679", count: 15, subject: "อัดคลิปสื่อการสอนออนไลน์" },
    { id: 10, room: "r5", date: "2026-08-27", timeStart: "08:00", timeEnd: "18:00", name: "ฝ่ายอาคารสถานที่", phone: "081-234-5680", count: 350, subject: "พิธีไหว้ครูประจำปีการศึกษา" },
  ];

  // เรียก API ของ Apps Script ทุกคนเห็นข้อมูลชุดเดียวกันที่เก็บบน Google Sheet
  async function apiCall(payload){
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    return res.json();
  }

  async function apiList(){
    const res = await fetch(`${API_URL}?action=list`);
    return res.json();
  }

  let state = { bookings: [] };

  // รายการที่ดำเนินการไปแล้ว (พ้นเวลา 19:00 น. ของวันที่จอง) จะถูกซ่อนจากตาราง (ไม่ลบออกจากฐานข้อมูลกลาง)
  function filterExpired(bookings){
    const now = new Date();
    return bookings.filter(b => now < new Date(b.date + "T19:00:00"));
  }

  async function fetchAndRender(){
    try{
      const data = await apiList();
      if(data.ok){
        state.bookings = filterExpired(data.bookings);
        render();
      }
    }catch(e){
      // เงียบไว้ระหว่างรีเฟรชอัตโนมัติ ไม่รบกวนผู้ใช้ที่กำลังดูตาราง
    }
  }

  const legend = document.getElementById("legend");
  ROOMS.forEach(r => {
    const span = document.createElement("span");
    span.innerHTML = `<span class="dot" style="background:${r.color}"></span>${r.name}`;
    legend.appendChild(span);
  });

  function formatDate(iso){
    const d = new Date(iso + "T00:00:00");
    return {
      display: `${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${d.getFullYear() + 543}`,
      weekday: WEEKDAYS[d.getDay()]
    };
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // แปลง Date เป็น "YYYY-MM-DD" ตามเวลาท้องถิ่น (ไม่ใช้ toISOString ซึ่งจะเลื่อนวันที่ผิดเมื่ออยู่ในโซนเวลา UTC+)
  function toLocalISODate(d){
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function render(){
    const headRow = document.getElementById("head-row");
    headRow.innerHTML = `<th class="date-col">วันที่จอง</th>` +
      ROOMS.map(r => `<th><span class="room-bar" style="background:${r.color}"></span>${r.name}</th>`).join("");

    const DAYS_TO_SHOW = 15;
    const now = new Date();
    const startDate = new Date(now);
    startDate.setHours(0,0,0,0);
    // หลัง 19:00 น. ถือว่าวันนี้ดำเนินการเสร็จสิ้นแล้ว ให้เริ่มแสดงตั้งแต่วันพรุ่งนี้แทน
    if(now.getHours() >= 19){
      startDate.setDate(startDate.getDate() + 1);
    }
    const dates = Array.from({ length: DAYS_TO_SHOW }, (_, i) => {
      const d = new Date(startDate);
      d.setDate(d.getDate() + i);
      return toLocalISODate(d);
    });
    const body = document.getElementById("body-rows");

    body.innerHTML = dates.map(date => {
      const { display, weekday } = formatDate(date);
      const cells = ROOMS.map(r => {
        const items = state.bookings.filter(b => b.date === date && b.room === r.id);
        if(items.length === 0){
          return `<td><span class="empty-cell">— ว่าง —</span></td>`;
        }
        const html = items.map(b => `
          <div class="booking" style="border-left-color:${r.color}">
            <button class="del" data-id="${b.id}" title="ลบรายการนี้">ลบ ✕</button>
            <span class="name">${escapeHtml(b.name)}</span>
            <span class="meta">${b.phone ? `โทร. ${escapeHtml(b.phone)} · ` : ""}ผู้เข้าร่วม ${b.count} คน</span>
            <span class="subject">${escapeHtml(b.subject)}</span>
            ${b.timeStart ? `<span class="meta">เวลา ${b.timeStart} - ${b.timeEnd} น.</span>` : ""}
          </div>`).join("");
        return `<td>${html}</td>`;
      }).join("");
      return `<tr>
        <td class="date-cell">${display}<span class="weekday">วัน${weekday}</span></td>
        ${cells}
      </tr>`;
    }).join("");

    document.querySelectorAll(".del").forEach(btn => {
      btn.addEventListener("click", async () => {
        if(!confirm("ยืนยันลบการจองนี้หรือไม่? การลบจะมีผลต่อทุกคนที่ใช้ระบบ")) return;
        const id = btn.dataset.id;
        btn.disabled = true;
        try{
          const result = await apiCall({ action: "delete", id });
          if(result.ok){
            state.bookings = filterExpired(result.bookings);
            render();
          }
        }catch(e){
          btn.disabled = false;
        }
      });
    });
  }

  if(API_URL.includes("PASTE_YOUR_WEB_APP_URL_HERE")){
    document.getElementById("body-rows").innerHTML =
      `<tr><td colspan="${ROOMS.length + 1}" style="padding:20px;color:var(--red);">ยังไม่ได้ตั้งค่า API_URL กรุณาวาง URL ของ Apps Script Web App ในโค้ด</td></tr>`;
  } else {
    render();          // วาดโครงตารางว่างทันที ระหว่างรอข้อมูลจากเซิร์ฟเวอร์
    fetchAndRender();  // ดึงข้อมูลจริงจากทุกคนที่จองไว้

    // ดึงข้อมูลใหม่ทุก 20 วินาที เพื่อให้เห็นการจอง/ลบของคนอื่นแบบเกือบเรียลไทม์
    setInterval(fetchAndRender, 20000);
  }
</script>

</body>
</html>
